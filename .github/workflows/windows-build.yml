name: Build Windows HR Test

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production
        run: npm run verify:production
      - name: Build Next for inspection
        run: npm run desktop:build

      - name: Inspect Next standalone
        shell: powershell
        run: |
          Write-Host "=== standalone root ==="
          Get-ChildItem ".next\standalone" -Force

          Write-Host "=== server.js locations ==="
          Get-ChildItem ".next\standalone" -Recurse -Filter "server.js" |
            Select-Object FullName

          Write-Host "=== next package locations ==="
          Get-ChildItem ".next\standalone" -Recurse -Directory -Filter "next" |
            Select-Object FullName

          Write-Host "=== node_modules locations ==="
          Get-ChildItem ".next\standalone" -Recurse -Directory -Filter "node_modules" |
            Select-Object FullName
      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Modular-Resume-Windows-HR-Test
          path: dist-windows/*.exe
          if-no-files-found: error
